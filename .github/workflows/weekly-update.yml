name: Weekly update reminder

# Opens a dated checklist issue every Monday so the weekly cadence never slips.

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Open (or skip) this week's update issue
        run: |
          set -euo pipefail
          WEEK="$(date -u +%G-W%V)"
          TITLE="Weekly GEO update — $WEEK"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$TITLE in:title" \
               --json title --jq '.[].title' | grep -qxF "$TITLE"; then
            echo "Issue for $WEEK already exists — nothing to do."
            exit 0
          fi
          # One argument per line, joined by printf. The previous version built the
          # body as BODY=$'...\n...' and interpolated "$WEEK" in the middle, which
          # ended that ANSI-C quoted string: everything after the week number sat in
          # ordinary single quotes, where \n is two literal characters. The issues
          # came out with "\n" printed from the second checklist item onward.
          #
          # printf '%s\n' takes the escaping problem away entirely -- no escape
          # sequences to preserve, and no heredoc, which cannot be indented inside a
          # YAML block scalar without either breaking the YAML or indenting the
          # Markdown into a code block.
          BODY="$(printf '%s\n' \
            'Weekly cadence checklist (see `updates/README.md`):' \
            '' \
            '- [ ] Scan what changed in the GEO landscape this week (engines, citation behavior, new controls).' \
            "- [ ] Add a dated log entry under \`updates/\` (e.g. \`updates/$WEEK.md\`)." \
            '- [ ] Update any chapter whose facts moved — keep every claim cited.' \
            '- [ ] Review open PRs & issues (new techniques, corrections).' \
            '- [ ] Bump `CHANGELOG.md` if there was a notable change.' \
            '' \
            '_Opened automatically to keep the weekly rhythm._')"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label weekly-update --body "$BODY"
